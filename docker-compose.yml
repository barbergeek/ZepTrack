version: '3.8'

services:
  zeptrack:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - zeptrack-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/zeptrack.db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required - generate with: openssl rand -hex 32}
    restart: unless-stopped

volumes:
  zeptrack-data:
    driver: local
